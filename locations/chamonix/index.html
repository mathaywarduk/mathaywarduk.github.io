<div class="fixed bottom-0 top-0 right-0 b-white max-w-screen md:max-w-md drop-shadow-[-5px_0_10px_rgba(0,0,0,0.25)] overflow-y-auto z-20 hideRight" id="mapContentWrapper">

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAV3uTC8stNqMKRlJhpZDo6c5YBha1VTY4&amp;libraries=&amp;v=weekly&amp;callback=initMap" defer></script>


<script>

// @TODO abstract this
  function initMap() {

    let bounds = new google.maps.LatLngBounds();
    let mapContainer = document.getElementById("map");
    let contentWrapper = document.getElementById("mapContentWrapper");
    let contentContainer = document.getElementById("mapContent");
    let closeButton = document.getElementById("mapContentClose");
    let locations = [{"title":"Aiguille du Midi","slug":"aiguille-du-midi","description":"The cable car to Aiguille du Midi is large and swingy, but the views of Mont Blanc and the rest of the alps are worth it.","lat":45.879203,"lng":6.887287,"hero":"Chamonix_009.jpg","category":"view","collection":"chamonix"},{"title":"Refuge Albert","slug":"refuge-albert","description":"Take the cable car from Le Tour and the Autannes ski-lift, before setting off for a long walk to Refuge Albert. Stunning views of the Galcier du Tour and surrounding mountains - if the cloud stays away.","lat":45.996679,"lng":6.986539,"hero":"Chamonix_015.jpg","category":"hike","collection":"chamonix"},{"title":"Grand Balcon Nord","slug":"grand-balcon-nord","description":"Running from Plan de l'Aiguille to the Montenvers–Mer de Glace, this is an easy hike for most with great views of Mont Blanc and over to Tête de la Raverettaz.","lat":45.917118,"lng":6.902288,"hero":"Chamonix_022.jpg","category":"hike","collection":"chamonix"},{"title":"Signal Forbes","slug":"signal-forbes","description":"A short detour off the Grand Balcon Nord is a climb up to Signal Forbes. From here you can see the famous Mer de Glace glacier, and the huge pointed peaks that surround it. Continue down the other side to take the Montenvers train back to Chamonix.","lat":45.928692,"lng":6.910502,"hero":"Chamonix_029.jpg","category":"hike","collection":"chamonix"},{"title":"Tête de la Raverettaz","slug":"tete-de-la-raverettaz","description":"To the north west of Mont Blanc is Tête de la Raverettaz. Walk up from Argentière, through the forest and then across to La Flégère for beautiful views.","lat":45.970716,"lng":6.894846,"hero":"Chamonix_037.jpg","category":"hike","collection":"chamonix"},{"title":"Argentière","slug":"argentiere","description":"Far less busy that Chamonix, but still with some nice bars and restaurants, Argentière has incredible views of Mont Blanc.","lat":45.983147,"lng":6.926405,"hero":"Chamonix_031.jpg","category":"view","collection":"chamonix"},{"title":"Lac Bleu","slug":"lac-bleu","description":"Just a short walk from the Aiguille du Midi mid-station, Lac Bleu is exactly as described.","lat":45.901537,"lng":6.891937,"hero":"Chamonix_011.jpg","category":"hike","collection":"chamonix"}];
    let collections = {"switzerland":{"title":"Switzerland","slug":"switzerland","hero":{"url":"Switzerland-029.jpg","alt":"Berggasthaus Meglisalp from the slopes of Schäfler Ridge"}},"chamonix":{"title":"Chamonix","slug":"chamonix","hero":{"url":"Chamonix_006.jpg","alt":"Slopes of Mont Blanc"}},"madeira":{"title":"Madeira","slug":"madeira","hero":{"url":"Madeira-007.jpg","alt":"First light on the hills below Bica da Cana"}},"iceland":{"title":"Iceland","slug":"iceland","hero":{"url":"Iceland-007.jpg","alt":"Sunrise at Reynisfjara"}},"dolomites":{"title":"Dolomites","slug":"dolomites","hero":{"url":"Dolomiti-7610.jpg","alt":"Alpe di Siusi"}},"alberta":{"title":"Alberta","slug":"alberta","hero":{"url":"Canada-016.jpg","alt":"Canadian Rockies"}},"lofoten":{"title":"Lofoten Islands","slug":"lofoten","hero":{"url":"Lofoten-052.jpg","alt":"Sakrisøya"}},"skye-hebrides":{"title":"Skye and the Hebrides","slug":"skye-hebrides","hero":{"url":"Skye-027.jpg","alt":"Sunset on Skye near Tarskavaig"}},"west-coast":{"title":"West Coast","slug":"west-coast","hero":{"url":"NC500-013.jpg","alt":"Howard in Plockton"}},"south-highlands":{"title":"South Highlands","slug":"south-highlands","hero":{"url":"Highlands-005.jpg","alt":"Sunset from Ben A'an"}},"lanzarote":{"title":"Lanzarote","slug":"lanzarote","hero":{"url":"Lanzarote-008.jpg","alt":"View from the car at Timanfaya National Park"}},"tenerife":{"title":"Tenerife","slug":"tenerife","hero":{"url":"Tenerife-003.jpg","alt":"Masca valley - sunset in the mist"}},"jericho":{"title":"Restaurant Jericho","slug":"jericho"}};
    let allMarkers = [];
    let baseURL = "https://mathayward.imgix.net/";

    // get location from query string
    const urlParams = new URLSearchParams(window.location.search);
    const qloc = urlParams.get('l');

    const map = new google.maps.Map(mapContainer, {
      zoom: 10,
      center: new google.maps.LatLng(45.914005, 6.880976),
      styles: [{"featureType":"administrative.land_parcel","stylers":[{"visibility":"off"}]},{"featureType":"administrative.neighborhood","stylers":[{"visibility":"off"}]},{"featureType":"poi","elementType":"labels.text","stylers":[{"visibility":"off"}]},{"featureType":"poi.attraction","stylers":[{"visibility":"off"}]},{"featureType":"poi.business","stylers":[{"visibility":"off"}]},{"featureType":"poi.government","stylers":[{"visibility":"off"}]},{"featureType":"poi.medical","stylers":[{"visibility":"off"}]},{"featureType":"poi.place_of_worship","stylers":[{"visibility":"off"}]},{"featureType":"poi.school","stylers":[{"visibility":"off"}]},{"featureType":"poi.sports_complex","stylers":[{"visibility":"off"}]},{"featureType":"road","elementType":"labels","stylers":[{"visibility":"off"}]},{"featureType":"water","elementType":"labels.text","stylers":[{"visibility":"off"}]},{"elementType":"geometry.fill","stylers":[{"saturation":-100}]},{"elementType":"labels.text","stylers":[{"saturation":-100}]},{"featureType":"water","elementType":"geometry.fill","stylers":[{"color":"#5bb2d7"},{"saturation":25},{"lightness":55}]}],
      mapTypeControl: false,
      streetViewControl: false,
      fullscreenControl: false,
    });

    for (let i = 0; i < locations.length; i++) {
      let title = locations[i].title;
      let collection = collections[locations[i].collection];
      let description = locations[i].description;
      let lat = locations[i].lat;
      let lng = locations[i].lng;
      let slug = locations[i].slug;
      let category = locations[i].category;
      let hero = locations[i].hero;

      if (typeof lat !== 'undefined' && typeof lng !== 'undefined') {

        let marker = new google.maps.Marker({
          position: new google.maps.LatLng(lat, lng),
          map: map,
          category: category,
          title: title,
          a: category,
          icon: {
            url: `/assets/images/icons/${category}_off.svg`,
            scaledSize: new google.maps.Size(32, 32)
          },
        });

        allMarkers.push(marker);
        
        bounds.extend(marker.position);

        google.maps.event.addListener(marker, 'click', (function(marker, i) {
          return function() {
        
            let imagesHTML = "";

            // change all markers
            allMarkers.forEach((element) => {
              element.setIcon(`/assets/images/icons/${element.category}_off.svg`);
            });

            // change this marker
            marker.setIcon(`/assets/images/icons/${marker.category}_on.svg`);

            // change map center to current marker
            map.setCenter({
              lat : lat,
              lng : lng
            });

            // Zoom in
            if (map.getZoom() < 10){
              map.setZoom(10);
            }

            heroHTML = `<picture class="w-full">
              <img alt="${title}" 
                src="${baseURL}${hero}?w=767&ar=2:3&fit=crop&crop=entropy"
                width="767">
            </picture>`

            // update HTML
            contentContainer.innerHTML = 
               `<div class="relative mb-8">
                  ${heroHTML}
                  <div class="absolute bottom-0 left-0 right-0 b-black-grad p-4">
                    <div class="overflow-hidden">
                      <h2 class="text-slide-up text-4xl font-display c-white leading-none pb-2">${title}</h2>
                    </div>
                  </div>
                </div>

                <div class="p-4">
                  <div class="overflow-hidden">
                    <h2 class="meta text-slide-down anim-delay-600">Info</h2>
                  </div>
                  <div class="fade-down anim-delay-600">
                    <p>${description}</p>
                  </div>
                </div>

                <div class="relative mt-auto">
                  <a href="/photography/${collection.slug}" class="collection-nav-item">
                    <div class="absolute bottom-0 left-0 p-4 z-10 c-white">
                      <div class="overflow-hidden">
                        <span class="meta text-slide-down anim-delay-600">Photography collection</span>
                      </div>
                      <div class="fade-down anim-delay-600">
                        <h2 class="text-2xl font-display leading-none tracking-wide mb-4 md:text-3xl lg:text-4xl inline-block">
                          ${collection.title}
                        </h2>
                      </div>
                    </div>
                    <img src="${baseURL}${collection.hero.url}?w=767&ar=3:2&fit=crop&crop=entropy" alt="${collection.hero.alt}" class="block">
                  </a>
                </div>`;

            // show content element
            closeButton.classList.add("slide-from-right");
            contentWrapper.classList.add("slide-from-right");
          }
        })(marker, i));

        if (qloc !== null && qloc === slug) {
          new google.maps.event.trigger( marker, 'click' );
        }

      }

    }
    
    if (qloc === null) {
      map.fitBounds(bounds);
    }

    //  When close button clicked
    closeButton.addEventListener("click", function() {

      contentContainer.innerHTML = "";
      // contentWrapper.classList.add("hidden");
      // closeButton.classList.add("hidden");
      // map.fitBounds(bounds);
      // map.setZoom(8);
      closeButton.classList.remove("slide-from-right");
      contentWrapper.classList.remove("slide-from-right");
      allMarkers.forEach((element) => {
        element.setIcon(`/assets/images/icons/${element.category}_off.svg`);
      });

    });
  }

</script>
