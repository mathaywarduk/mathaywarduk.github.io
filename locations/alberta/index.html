<div id="map" class="w-screen h-screen"></div>

<button class="close fixed top-4 right-4 c-white z-30 hideRight" id="mapContentClose"><span class="sr-only">Close</span></button>

<div class="fixed bottom-0 top-0 right-0 b-white max-w-screen md:max-w-md drop-shadow-[-5px_0_10px_rgba(0,0,0,0.25)] overflow-y-auto z-20 hideRight" id="mapContentWrapper">

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAV3uTC8stNqMKRlJhpZDo6c5YBha1VTY4&amp;libraries=&amp;v=weekly&amp;callback=initMap" defer></script>


<script>

// @TODO abstract this
  function initMap() {

    let bounds = new google.maps.LatLngBounds();
    let mapContainer = document.getElementById("map");
    let contentWrapper = document.getElementById("mapContentWrapper");
    let contentContainer = document.getElementById("mapContent");
    let closeButton = document.getElementById("mapContentClose");
    let locations = [{"title":"Medicine Lake","slug":"medicine-lake","description":"Driving past this lake on the way to Maligne Lake I saw some incredible reflections, but for some reason never shot them! Either way it's a beautiful spot.","lat":52.838551,"lng":-117.719025,"hero":"Canada-009.jpg","category":"view","collection":"alberta"},{"title":"Mount Lorette","slug":"mount-lorette","description":"We stayed at Sundance Lodges for a night when in Canada and, because it was off-season, had the place to ourselves. Just through the trees from our tent was the river and an amazing view of Mount Lorette.","lat":50.953974,"lng":-115.125016,"hero":"Canada-002.jpg","category":"view","collection":"alberta"},{"title":"Peyto Lake","slug":"peyto-lake","description":"One of those views that's all over Instagram so, as you'd expect, it's pretty easy to get to. Park in the car park and walk 20 minutes to the viewpoint. You won't be alone.","lat":51.71828,"lng":-116.508286,"hero":"Canada-019.jpg","category":"view","collection":"alberta"},{"title":"Maligne Lake","slug":"maligne-lake","description":"It's a bit of a drive down a one-way in, one-way out road to Maligne Lake, but you arrive to a peaceful view of mountains and pine trees and a pretty cool looking boathouse.","lat":52.728815,"lng":-117.641685,"hero":"Canada-007.jpg","category":"view","collection":"alberta"},{"title":"Vermillion Lakes","slug":"vermillion-lakes","description":"Easy to shoot from the road, Vermillion Lakes are a group of lakes just outside the town of Banff, which means you'll often get kayakers and canoers in the foreground.","lat":51.182168,"lng":-115.603571,"hero":"Canada-014.jpg","category":"view","collection":"alberta"},{"title":"Bow Glacier Falls","slug":"bow-glacier-falls","description":"I loved this walk through a forest, up and small canyon and over river. There's so much variety in things to shoot and it always feels good to get outside in the landscape.","lat":51.659769,"lng":-116.488941,"hero":"Canada-012.jpg","category":"hike","collection":"alberta"}];
    let collections = {"switzerland":{"title":"Switzerland","slug":"switzerland","hero":{"url":"Switzerland-029.jpg","alt":"Berggasthaus Meglisalp from the slopes of Schäfler Ridge"}},"madeira":{"title":"Madeira","slug":"madeira","hero":{"url":"Madeira-007.jpg","alt":"First light on the hills below Bica da Cana"}},"iceland":{"title":"Iceland","slug":"iceland","hero":{"url":"Iceland-007.jpg","alt":"Sunrise at Reynisfjara"}},"dolomites":{"title":"Dolomites","slug":"dolomites","hero":{"url":"Dolomiti-7610.jpg","alt":"Alpe di Siusi"}},"alberta":{"title":"Alberta","slug":"alberta","hero":{"url":"Canada-016.jpg","alt":"Canadian Rockies"}},"lofoten":{"title":"Lofoten Islands","slug":"lofoten","hero":{"url":"Lofoten-052.jpg","alt":"Sakrisøya"}},"skye-hebrides":{"title":"Skye and the Hebrides","slug":"skye-hebrides","hero":{"url":"Skye-027.jpg","alt":"Sunset on Skye near Tarskavaig"}},"west-coast":{"title":"West Coast","slug":"west-coast","hero":{"url":"NC500-013.jpg","alt":"Howard in Plockton"}},"south-highlands":{"title":"South Highlands","slug":"south-highlands","hero":{"url":"Highlands-005.jpg","alt":"Sunset from Ben A'an"}},"lanzarote":{"title":"Lanzarote","slug":"lanzarote","hero":{"url":"Lanzarote-008.jpg","alt":"View from the car at Timanfaya National Park"}},"tenerife":{"title":"Tenerife","slug":"tenerife","hero":{"url":"Tenerife-003.jpg","alt":"Masca valley - sunset in the mist"}},"jericho":{"title":"Restaurant Jericho","slug":"jericho"}};
    let allMarkers = [];
    let baseURL = "https://mathayward.imgix.net/";

    // get location from query string
    const urlParams = new URLSearchParams(window.location.search);
    const qloc = urlParams.get('l');

    const map = new google.maps.Map(mapContainer, {
      zoom: 10,
      center: new google.maps.LatLng(51.324917, -115.967786),
      styles: [{"featureType":"administrative.land_parcel","stylers":[{"visibility":"off"}]},{"featureType":"administrative.neighborhood","stylers":[{"visibility":"off"}]},{"featureType":"poi","elementType":"labels.text","stylers":[{"visibility":"off"}]},{"featureType":"poi.attraction","stylers":[{"visibility":"off"}]},{"featureType":"poi.business","stylers":[{"visibility":"off"}]},{"featureType":"poi.government","stylers":[{"visibility":"off"}]},{"featureType":"poi.medical","stylers":[{"visibility":"off"}]},{"featureType":"poi.place_of_worship","stylers":[{"visibility":"off"}]},{"featureType":"poi.school","stylers":[{"visibility":"off"}]},{"featureType":"poi.sports_complex","stylers":[{"visibility":"off"}]},{"featureType":"road","elementType":"labels","stylers":[{"visibility":"off"}]},{"featureType":"water","elementType":"labels.text","stylers":[{"visibility":"off"}]},{"elementType":"geometry.fill","stylers":[{"saturation":-100}]},{"elementType":"labels.text","stylers":[{"saturation":-100}]},{"featureType":"water","elementType":"geometry.fill","stylers":[{"color":"#5bb2d7"},{"saturation":25},{"lightness":55}]}],
      mapTypeControl: false,
      streetViewControl: false,
      fullscreenControl: false,
    });

    for (let i = 0; i < locations.length; i++) {
      let title = locations[i].title;
      let collection = collections[locations[i].collection];
      let description = locations[i].description;
      let lat = locations[i].lat;
      let lng = locations[i].lng;
      let slug = locations[i].slug;
      let category = locations[i].category;
      let hero = locations[i].hero;

      if (typeof lat !== 'undefined' && typeof lng !== 'undefined') {

        let marker = new google.maps.Marker({
          position: new google.maps.LatLng(lat, lng),
          map: map,
          category: category,
          title: title,
          a: category,
          icon: {
            url: `/assets/images/icons/${category}_off.svg`,
            scaledSize: new google.maps.Size(32, 32)
          },
        });

        allMarkers.push(marker);
        
        bounds.extend(marker.position);

        google.maps.event.addListener(marker, 'click', (function(marker, i) {
          return function() {
        
            let imagesHTML = "";

            // change all markers
            allMarkers.forEach((element) => {
              element.setIcon(`/assets/images/icons/${element.category}_off.svg`);
            });

            // change this marker
            marker.setIcon(`/assets/images/icons/${marker.category}_on.svg`);

            // change map center to current marker
            map.setCenter({
              lat : lat,
              lng : lng
            });

            // Zoom in
            if (map.getZoom() < 10){
              map.setZoom(10);
            }

            heroHTML = `<picture class="w-full">
              <img alt="${title}" 
                src="${baseURL}${hero}?w=767&ar=2:3&fit=crop&crop=entropy"
                width="767">
            </picture>`

            // update HTML
            contentContainer.innerHTML = 
               `<div class="relative mb-8">
                  ${heroHTML}
                  <div class="absolute bottom-0 left-0 right-0 b-black-grad p-4">
                    <div class="overflow-hidden">
                      <h2 class="text-slide-up text-4xl font-display c-white leading-none pb-2">${title}</h2>
                    </div>
                  </div>
                </div>

                <div class="p-4">
                  <div class="overflow-hidden">
                    <h2 class="meta text-slide-down anim-delay-600">Info</h2>
                  </div>
                  <div class="fade-down anim-delay-600">
                    <p>${description}</p>
                  </div>
                </div>

                <div class="relative mt-auto">
                  <a href="/photography/${collection.slug}" class="collection-nav-item">
                    <div class="absolute bottom-0 left-0 p-4 z-10 c-white">
                      <div class="overflow-hidden">
                        <span class="meta text-slide-down anim-delay-600">Photography collection</span>
                      </div>
                      <div class="fade-down anim-delay-600">
                        <h2 class="text-2xl font-display leading-none tracking-wide mb-4 md:text-3xl lg:text-4xl inline-block">
                          ${collection.title}
                        </h2>
                      </div>
                    </div>
                    <img src="${baseURL}${collection.hero.url}?w=767&ar=3:2&fit=crop&crop=entropy" alt="${collection.hero.alt}" class="block">
                  </a>
                </div>`;

            // show content element
            closeButton.classList.add("slide-from-right");
            contentWrapper.classList.add("slide-from-right");
          }
        })(marker, i));

        if (qloc !== null && qloc === slug) {
          new google.maps.event.trigger( marker, 'click' );
        }

      }

    }
    
    if (qloc === null) {
      map.fitBounds(bounds);
    }

    //  When close button clicked
    closeButton.addEventListener("click", function() {

      contentContainer.innerHTML = "";
      // contentWrapper.classList.add("hidden");
      // closeButton.classList.add("hidden");
      // map.fitBounds(bounds);
      // map.setZoom(8);
      closeButton.classList.remove("slide-from-right");
      contentWrapper.classList.remove("slide-from-right");
      allMarkers.forEach((element) => {
        element.setIcon(`/assets/images/icons/${element.category}_off.svg`);
      });

    });
  }

</script>
