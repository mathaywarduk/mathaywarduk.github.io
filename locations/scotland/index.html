<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAV3uTC8stNqMKRlJhpZDo6c5YBha1VTY4&amp;libraries=&amp;v=weekly&amp;callback=initMap" defer></script>


<script>

// @TODO abstract this
  function initMap() {

    let bounds = new google.maps.LatLngBounds();
    let mapContainer = document.getElementById("map");
    let contentWrapper = document.getElementById("mapContentWrapper");
    let contentContainer = document.getElementById("mapContent");
    let closeButton = document.getElementById("mapContentClose");
    let locations = [{"title":"Beinn an t-Sìdhean","slug":"beinn-an-t-sidhein","description":"Also known as Ben Sheann. Either way it's a quick climb to great views of munros and the Trossachs.","lat":56.331326,"lng":-4.351258,"hero":"Ben-Sheann-06.jpg","category":"hike","collection":"south-highlands"},{"title":"Goatfell","slug":"goatfell","description":"Arran is a beautiful island of beaches, clear waters and mountains. Goatfell is it's highest peak and, therefore, often full of tourists. Take the back route from Corrie for better views and more alone time.","lat":55.627964,"lng":-5.192354,"hero":"Goatfell-007.jpg","category":"hike","collection":"skye-hebrides"},{"title":"West Lawers range","slug":"west-lawers","description":"The Ben Lawers range consists of seven munros just above Loch Tay. The western two munros have great views of Ben Lawers and the Tarmachan Ridge.","lat":56.550318,"lng":-4.266548,"hero":"West-Lawers-018.jpg","category":"hike","collection":"south-highlands"},{"title":"The Golden Road","slug":"golden-road","description":"If you visit the Isle of Harris by car, be sure to take a drive down the golden road at sunset. It's spectactular!","lat":57.801433,"lng":-6.862021,"hero":"Hebrides-011.jpg","category":"view","collection":"skye-hebrides"},{"title":"Traigh Ghearadha","slug":"traigh-ghearadha","description":"There's not a lot to look at on the Isle of Lewis, it's all pretty flat. But at the far north there are a couple of really nice beaches, like Traigh Ghearadha aka Garry Beach.","lat":58.367425,"lng":-6.21603,"hero":"Hebrides-010.jpg","category":"view","collection":"skye-hebrides"},{"title":"Usiken Bay","slug":"uisken-bay","description":"Uisken Bay is a beautiful spot on the Isle of Mull, complete with sandy beach, coves and rock formations to explore. And you can wild camp for a fee.","lat":56.290406,"lng":-6.214993,"hero":"Hebrides-002.jpg","category":"view","collection":"skye-hebrides"},{"title":"Upper Loch Torridon","slug":"upper-loch-torridon","description":"The area around Torridon is one of the most beautiful parts of Scotland in my opinion. This part of Loch Torridon faces west, so golden hour can be pretty beautiful.","lat":57.552429,"lng":-5.532568,"hero":"NC500-043.jpg","category":"view","collection":"west-coast"},{"title":"Maol Chean-Dearg","slug":"maol-chean-dearg","description":"Not a well-known Munro and one of the smaller ones, but has a great up-close view of the imposing An Rhuad-stac and magnificent summit views of Torridon.","lat":57.491424,"lng":-5.465087,"hero":"MCD_008.jpg","category":"hike","collection":"west-coast"},{"title":"Big Sand Beach","slug":"big-sand-beach","description":"The name of the beach is about as perfect as it gets. Walk through the campsite and over huge sand dunes to get there. When you're there you'll get great views of the Torridon range the south-east, as well as plenty rocks and sand to explore.","lat":57.734061,"lng":-5.764749,"hero":"NC500-039.jpg","category":"view","collection":"west-coast"},{"title":"Plockton Harbour","slug":"plockton-harbour","description":"The harbour at Plockton is not only great because it has two pubs and an excellent chip shop. When the tide is low, you can walk over the small island in the harbour and get some nice shots of Sgeir Bhuidhe.","lat":57.338228,"lng":-5.648738,"hero":"NC500-041.jpg","category":"view","collection":"west-coast"},{"title":"Shores around Plockton","slug":"plockton-shores","description":"We stayed at <a href='https://www.unique-cottages.co.uk/cottages/west-coast/lochalsh-wester-ross/gb7-nead-an-eoin' target='_blank'>Nead an Eoin</a> just outside Plockton, which had it's own private slipway and cove for wild swimming and time outdoors with views toward Applecross.","lat":57.340089,"lng":-5.672324,"hero":"NC500-038.jpg","category":"view","collection":"west-coast"},{"title":"Sandwood Bay","slug":"sandwood-bay","description":"It's a relatively boring 2-hour walk over to Sandwood Bay and the final part of it is rife with midges. Once you get there though, it's incredible. Probably the best beach I've visited in the UK with large pink-tinged sand dunes, a loch behind, the sea in front and huge cliff faces in the distance. I loved it and so did the dog!","lat":58.539982,"lng":-5.058773,"hero":"NC500-056.jpg","category":"hike","collection":"west-coast"},{"title":"Durness","slug":"durness","description":"The turquoise waters of the beach at Durness looks tropical at times, although touching the water will quickly bring you back to reality.","lat":58.567819,"lng":-4.735427,"hero":"NC500-031.jpg","category":"view","collection":"west-coast"},{"title":"Duncansby Head","slug":"duncansby-head","description":"I've not found much to see or do around the north east coast of Scotland. One pretty wet walk we did manage to do though was from John o'Groats to Duncansby Head to sea the sea stacks.","lat":58.638602,"lng":-3.028452,"hero":"NC500-002.jpg","category":"hike","collection":"west-coast"},{"title":"Assynt mountains","slug":"assynt","description":"The mountains in Assynt are pretty spread out, with a row of Canisp, Suilven, Cùl Mòr, Cùl Beag and Stac Pollaidh visible from a few places to the west. This spot is a car park on the Drumbeg road where you can just see all five on a clear day.","lat":58.177029,"lng":-5.274024,"hero":"NC500-052.jpg","category":"view","collection":"west-coast"},{"title":"Cam Loch","slug":"cam-loch","description":"Most people approach Suilven from Lochinver, but there are a number of other routes to the foot of the mountain. The route from Cam Loch gives great views of the south side of Suilven. If you don't fancy the hike, visit around sunset and you'll get rewarded with some amazing views.","lat":58.06535,"lng":-4.998111,"hero":"NC500-017.jpg","category":"hike","collection":"west-coast"},{"title":"Drumbeg Road","slug":"drumbeg-road","description":"The coastal road around Drumbeg is one of my favourites. It's narrow and not suitable for large vehicles and, because it ends up back at the main road eventually, you often get it to yourself. It winds around Lochans and hills and is host to some of the most beautiful beaches in Scotland.","lat":58.177886,"lng":-5.283133,"hero":"NC500-055.jpg","category":"view","collection":"west-coast"},{"title":"Stac Pollaidh","slug":"stac-pollaidh","description":"It's known as a mountain, but the climb isn't too difficult. Set off as early enough and by the time you reach the east top you might be lucky enough to see the cloud clearing above the surrounding lochs.","lat":58.043943,"lng":-5.206258,"hero":"NC500-028.jpg","category":"hike","collection":"west-coast"},{"title":"Cùl Mòr","slug":"cul-mor","description":"The first half or more of the walk up Cùl Mòr is pretty dull, but once you reach the saddle between the two peaks the views over to Stac Pollaidh and Suilven are incredible. Take a head torch and go late for a spectactular golden hour.","lat":58.057925,"lng":-5.118133,"hero":"Assynt-001.jpg","category":"hike","collection":"west-coast"},{"title":"Suilven","slug":"suilven","description":"I wanted to climb Suilven the first time I saw it. After a few failed or called off attempts, I finally got up there in 2021 and it didn't disappoint. The walk in is long but not difficult, which is in contrast to the climb after you reach the base.","lat":58.114965,"lng":-5.134797,"hero":"NC500-058.jpg","category":"hike","collection":"west-coast"},{"title":"Ben Vorlich","slug":"ben-vorlich","description":"This is a relatively \"easy\" munro in the summer months and even was when we did it in October (but obviously check the weather first). The mountain often has a snow-capped top which makes for some dramatic shots.","lat":56.344015,"lng":-4.220815,"hero":"Highlands-026.jpg","category":"hike","collection":"south-highlands"},{"title":"Ben A'an","slug":"ben-aan","description":"From a purely view vs effort point of view, Ben A'an has to be the best hill in Scotland. The view over Loch Katrine to the west is beautiful at any time of day, but at sunset it's awesome. Effort-wise, we spent longer at the top than we did walking up there.","lat":56.242641,"lng":-4.41857,"hero":"Highlands-006.jpg","category":"hike","collection":"south-highlands"},{"title":"Stob Binnein","slug":"stob-binnein","description":"The first munro I climbed with my wife and dog and probably my favourite. It's tough going to start with, but if you climb it from the south, you get instant views down Inverlochlarig glen and toward the munros surrounding it. Cloud inversions here are more common than other locations too.","lat":56.346114,"lng":-4.520221,"hero":"Highlands-017.jpg","category":"hike","collection":"south-highlands"},{"title":"Glentruim","slug":"glentruim","description":"My wife and I got married in Glentruim, so had easy access to this little view point over the Spey valley. Because of the right to roam in Scotland and the fact that the view point is well away from the buildings in the estate, you're well within your rights to visit.","lat":57.029772,"lng":-4.17729,"hero":"Highlands-028.jpg","category":"view","collection":"south-highlands"},{"title":"Stob Dearg","slug":"stob-dearg","description":"Buachaille Etive Mòr is the most photographed mountain in the UK. Largely because of the larger of it's peaks, Stob Dearg, and the fact that it can be easily shot from the road through Glen Coe. Go early or late in the day to avoid the crowds, though.","lat":56.653637,"lng":-4.861952,"hero":"Highlands-013.jpg","category":"view","collection":"south-highlands"},{"title":"Glen Coe","slug":"glen-coe","description":"There are lots of great hikes in the Glen Coe area. This shot was taken on the way up to the Hidden Valley pretty early in the morning.","lat":56.661278,"lng":-4.984233,"hero":"Highlands-014.jpg","category":"hike","collection":"south-highlands"},{"title":"Beinn Each","slug":"beinn-each","description":"Our first wild camp was on the west side of Beinn Each, but you don't need to camp to get the sunset views. It takes about an hour to get to this viewpoint where you'll be rewarded with layers of the Trossachs and beyond. Reach the top in another 30 minutes if you fancy it, or just come down.","lat":56.311323,"lng":-4.271223,"hero":"Wild-Camp-008.jpg","category":"hike","collection":"south-highlands"},{"title":"Elgol Beach","slug":"elgol-beach","description":"Elgol is the end of the road on the Strathaird peninsula in Skye, but it has one of the best and most accessible views of the Cuillin you can get. Go when the tide is on the way out, so you can walk around the huge rockface to find the view.","lat":57.147283,"lng":-6.107415,"hero":"Skye-043.jpg","category":"view","collection":"skye-hebrides"},{"title":"Neist Point","slug":"neist-point","description":"The classic lighthouse at the end of a peninsula shot is pretty well known on Instagram and, like always, it's because it's easy to get to. If you fancy something a little more, walk down the steep steps for a different angle.","lat":57.428056,"lng":-6.783102,"hero":"Skye-036.jpg","category":"view","collection":"skye-hebrides"},{"title":"Tarskavaig","slug":"tarskavaig","description":"On our first visit to Skye we went out to find a good spot for sunset. We were lucky enough to drive toward Tarskavaig and spot this beautiful view over Loch Dhughaill toward the Cuillin","lat":57.102602,"lng":-5.92885,"hero":"Skye-046.jpg","category":"view","collection":"skye-hebrides"},{"title":"Camasunary Bay","slug":"camasunary-bay","description":"Probably the best walk I've done on Skye. The walk over the Camasunary Bay starts out pretty run-of-the-mill, but once you reach the top of the hill, there are incredible views over the the massive Cuillin and Sgurr na Stri. Carry on down to the bay itself and explore for more shots, but be aware of the amount of plastic waste that's washed up.","lat":57.186677,"lng":-6.096459,"hero":"Skye-015.jpg","category":"view","collection":"skye-hebrides"},{"title":"Sgurr na Stri","slug":"sgurr-na-stri","description":"This is a tiring walk with a great reward. The round trip is nearly 24km but the majority of it is, thankfully, pretty flat. When you do reach the top of the mountain there are awesome views of Loch Coruisk, the Cuillin and the sea.","lat":57.197946,"lng":-6.142033,"hero":"Skye-048.JPG","category":"hike","collection":"skye-hebrides"}];
